workspace:
  base: /workspace
  path: src

when:
  - event: push
    branch: main
    path:
      include:
        - ".woodpecker/worker.yml"
        - "apps/worker/**"
        - "packages/**"
        - "package.json"
        - "pnpm-workspace.yaml"
        - "pnpm-lock.yaml"
  - event: tag
    ref: "refs/tags/worker/v*"

steps:
  prepare:
    image: node:24
    commands:
      - corepack enable
      - pnpm install --frozen-lockfile
      - pnpm build:packages

  lint:
    image: node:24
    commands:
      - corepack enable
      - pnpm --filter @when/worker check
      - pnpm --filter @when/worker lint

  test:
    image: node:24
    commands:
      - corepack enable
      - pnpm --filter @when/worker test

  build:
    image: node:24
    commands:
      - corepack enable
      - pnpm --filter @when/worker build

  check-version:
    image: node:24
    commands:
      - cd apps/worker
      - |
        VERSION_FROM_PKG=$(node -p "require('./package.json').version")

        if [ "$VERSION_FROM_TAG" != "$VERSION_FROM_PKG" ]; then
          echo "Version mismatch: Git tag version $VERSION_FROM_TAG does not match package.json version: $VERSION_FROM_PKG"
          exit 1
        fi
    environment:
      VERSION_FROM_TAG: ${CI_COMMIT_TAG#worker/v}
    when:
      - event: tag

  extract-semver-tags:
    image: alpine/git:latest
    commands:
      - |
        VERSION_FULL="${CI_COMMIT_TAG#worker/v}"
        VERSION_MAJOR=$(echo "$VERSION_FULL" | cut -d. -f1)
        VERSION_MINOR=$(echo "$VERSION_FULL" | cut -d. -f2)

        SEMVER_FULL="$VERSION_FULL"
        SEMVER_MAJOR_MINOR="$VERSION_MAJOR.$VERSION_MINOR"
        SEMVER_MAJOR="$VERSION_MAJOR"

        echo "Extracted versions: $SEMVER_FULL, $SEMVER_MAJOR_MINOR, $SEMVER_MAJOR"
        echo -e "$SEMVER_FULL\n$SEMVER_MAJOR\n$SEMVER_MAJOR_MINOR" >> .tags
        cat .tags
    when:
      - event: tag

  build-docker-main:
    image: woodpeckerci/plugin-docker-buildx:6.0.3
    settings:
      repo: git.eleith.com/eleith/when-worker
      username: eleith
      dockerfile: apps/worker/Dockerfile
      context: .
      registry: https://git.eleith.com
      tags:
        - latest
      password:
        from_secret: gitea_docker_registry
    when:
      - event: push
        branch: main

  build-docker-tag:
    image: woodpeckerci/plugin-docker-buildx:6.0.3
    settings:
      repo: git.eleith.com/eleith/when-worker
      username: eleith
      dockerfile: apps/worker/Dockerfile
      context: .
      registry: https://git.eleith.com
      tags_file: .tags
      password:
        from_secret: gitea_docker_registry
    when:
      - event: tag

  notify-success:
    image: deblan/woodpecker-email:3.2.0
    settings:
      dsn:
        from_secret: woodpecker_email_dsn
      from:
        address:
          from_secret: woodpecker_email_from_address
        name:
          from_secret: woodpecker_email_from_name
      recipients:
        from_secret: woodpecker_email_recipient
      level: success
      recipients_only: true
    when:
      - status: [success]

  notify-failure:
    image: deblan/woodpecker-email:3.2.0
    settings:
      dsn:
        from_secret: woodpecker_email_dsn
      from:
        address:
          from_secret: woodpecker_email_from_address
        name:
          from_secret: woodpecker_email_from_name
      recipients:
        from_secret: woodpecker_email_recipient
      level: failure
      recipients_only: true
    when:
      - status: [failure]

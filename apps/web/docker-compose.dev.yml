services:
  when-app:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: dev
    user: '${UID:-1000}:${GID:-1000}'
    ports:
      - '5173:5173'
    volumes:
      - ./.env:/m/apps/web/.env
      - ./src:/m/apps/web/src
      - ./static:/m/apps/web/static
      - ./config.yaml:/m/apps/web/config.yaml
      - ./svelte.config.js:/m/apps/web/svelte.config.js
      - ./vite.config.ts:/m/apps/web/vite.config.ts
      - ./tsconfig.json:/m/apps/web/tsconfig.json
      - ./eslint.config.js:/m/apps/web/eslint.config.js
      - ./data:/m/apps/web/data
      - ./data/public:/m/apps/web/static/public
      - ../../packages/config/src:/m/packages/config/src
      - ../../packages/db/src:/m/packages/db/src
      - ../../packages/jobs/src:/m/packages/jobs/src
      - ../../packages/calendar/src:/m/packages/calendar/src
    env_file:
      - ./.env
    environment:
      NODE_ENV: development
      AUTH_SECRET: ${AUTH_SECRET:-development-only-secret-please-change-it-32chars}

  when-worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
      target: dev
    user: '${UID:-1000}:${GID:-1000}'
    ports:
      - '9000:9000'
    env_file:
      - ./.env
    environment:
      NODE_ENV: development
    volumes:
      - ../worker/src:/m/apps/worker/src
      - ./config.yaml:/m/apps/worker/config.yaml
      - ./data:/m/apps/worker/data
      - ../../packages/config/src:/m/packages/config/src
      - ../../packages/db/src:/m/packages/db/src
      - ../../packages/jobs/src:/m/packages/jobs/src
      - ../../packages/calendar/src:/m/packages/calendar/src

  when-mailpit:
    image: axllent/mailpit:latest
    ports:
      - '8025:8025'
      - '1025:1025'

volumes:
  when-dev-data:

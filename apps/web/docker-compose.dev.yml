services:
  when-dev:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile.dev
    user: '${UID:-1000}:${GID:-1000}'
    ports:
      - '5173:5173'
    volumes:
      - ../../.env:/app/apps/web/.env
      - ./src:/app/apps/web/src
      - ./static:/app/apps/web/static
      - ./config.yaml:/app/apps/web/config.yaml
      - ./svelte.config.js:/app/apps/web/svelte.config.js
      - ./vite.config.ts:/app/apps/web/vite.config.ts
      - ./tsconfig.json:/app/apps/web/tsconfig.json
      - ./eslint.config.js:/app/apps/web/eslint.config.js
      - ./data:/app/apps/web/data
      - ./data/public:/app/apps/web/static/public
    environment:
      NODE_ENV: development
      AUTH_SECRET: ${AUTH_SECRET:-development-only-secret-please-change-it-32chars}

  # Worker shares the same config.yaml + data dir as web, so it opens the same
  # when.sqlite and the openworkflow queue.sqlite (paths resolve relative to the
  # config file). tsx watches the bind-mounted source for live reload.
  worker-dev:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile.dev
    user: '${UID:-1000}:${GID:-1000}'
    ports:
      - '9000:9000'
    env_file:
      - ../../.env
    environment:
      NODE_ENV: development
    volumes:
      - ../worker/src:/m/apps/worker/src
      - ./config.yaml:/m/apps/worker/config.yaml
      - ./data:/m/apps/worker/data
    depends_on:
      - mailpit

  # Local SMTP sink; the worker will deliver booking emails here (UI on :8025).
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '8025:8025'
      - '1025:1025'

volumes:
  when-dev-data:

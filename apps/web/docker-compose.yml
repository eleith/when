services:
  when-app:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: prod
    ports:
      - '3000:3000'
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./data:/app/data
      - ./data/public:/app/build/client/public
    restart: unless-stopped
    depends_on:
      when-worker:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/healthz',r=>process.exit(r.statusCode===200?0:1))"
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  when-worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
      target: prod
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:9000/healthz',r=>process.exit(r.statusCode===200?0:1))"
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  when-cli:
    build:
      context: ../..
      dockerfile: apps/cli/Dockerfile
      target: prod
    profiles:
      - tools
    stdin_open: true
    tty: true
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./data:/app/data
      - ./data/public:/app/build/client/public

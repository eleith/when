# yaml-language-server: $schema=./config.schema.json
#
# Minimal starter config for When. Fill in the ${ENV_VAR} references
# before running the app, or replace them with literal values.
# Reference: https://when.app/schema/config.json

auth:
  credentials:
    username: admin
    password: '${WHEN_ADMIN_PASSWORD}' # defaults to WHEN_ADMIN_PASSWORD env var if omitted

user:
  name: 'Your Name'
  timezone: 'UTC'
  email: 'you@example.com'
  appearance:
    title: 'Welcome to my scheduling page'
    description: 'A little bit about me and **why** I want to schedule a meeting.'
    logo_url: '/public/logo.png'
    avatar_url: '/public/avatar.jpg'
    favicon_url: '/public/favicon.ico'
    font_name: 'Outfit'
    primary_light_color: '#166534'
    primary_dark_color: '#34d399'

# Required — appointment emails are sent over this SMTP server.
smtp:
  host: 'smtp.example.com'
  port: 587
  user: 'you@example.com'
  pass: '${SMTP_PASSWORD}'

services:
  - name: 'caldav-service'
    type: 'caldav'
    url: 'https://caldav.example.com/dav/you/cal/'
    username: 'you'
    password: '${CALDAV_PASSWORD}'

calendars:
  - name: 'main'
    type: 'caldav'
    service: 'caldav-service'
    url: 'https://caldav.example.com/dav/you/cal/'

schedules:
  - name: 'standard'
    weekly:
      monday: ['09:00-17:00']
      tuesday: ['09:00-17:00']
      wednesday: ['09:00-17:00']
      thursday: ['09:00-17:00']
      friday: ['09:00-17:00']

meetings:
  - name: '30-minute chat'
    duration_minutes: 30
    slug: 'chat'
    booking_approval: 'instant'
    booking_calendar: 'main'
    schedule: 'standard'
    image_url: '/public/chat-icon.png'
    description: 'A quick catch-up or intro call.'

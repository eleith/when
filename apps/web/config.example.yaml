# yaml-language-server: $schema=./config.schema.json
#
# Minimal starter config for When. Only the essentials are shown here — every
# field omitted below has a sensible default (autocomplete against the schema
# above to discover them). Fill in the ${ENV_VAR} references, or replace them
# with literal values.

auth:
  credentials:
    username: admin
    # password defaults to the WHEN_ADMIN_PASSWORD env var

user:
  name: 'Your Name'
  email: 'you@example.com'
  # timezone defaults to the TZ env var, or UTC
  # appearance is optional — title, colors, logo, favicon and avatar all default

# Appointment emails are sent over this SMTP server.
smtp:
  host: 'smtp.example.com'
  user: 'you@example.com'
  pass: '${SMTP_PASSWORD}'
  # port defaults to 587

services:
  - name: 'caldav-service'
    type: 'caldav'
    url: 'https://caldav.example.com/dav/you/cal/'
    username: 'you'
    password: '${CALDAV_PASSWORD}'

calendars:
  - name: 'main'
    type: 'caldav'
    service: 'caldav-service'
    url: 'https://caldav.example.com/dav/you/cal/'

schedules:
  - name: 'standard'
    # weekly defaults to Monday–Friday 09:00–17:00 when omitted

meetings:
  - name: '30-minute chat'
    # `schedule` and `booking_calendar` default to the first declared above.
    # `slug` defaults to "30-minute-chat", `duration_minutes` to 30, and
    # `booking_approval` to "request".

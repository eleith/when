# yaml-language-server: $schema=../../../../../packages/config/src/config.schema.json
#
# Fixture config for the Playwright suite. No `${ENV_VAR}` references — a run must
# not depend on the developer's shell.

auth:
  credentials:
    username: admin
    password: e2e-admin-password

user:
  name: 'E2E Fixture'
  email: 'e2e@example.test'
  timezone: 'UTC'

smtp:
  host: 'smtp.example.test'
  username: 'e2e@example.test'
  password: 'e2e-smtp-password'

providers:
  fixture-service:
    type: 'caldav'
    url: 'http://caldav.example.test/dav/'
    username: 'e2e'
    password: 'e2e-caldav-password'
    calendars:
      main:
        href: 'calendars/e2e/main/'

  fixture-video:
    type: 'nextcloud'
    url: 'https://video.example.test'
    username: 'e2e'
    password: 'e2e-video-password'
    calendars: {}

schedules:
  standard:
    weekly:
      - days: [mon, tue, wed, thu, fri]
        from: '09:00'
        to: '17:00'

  host-durations:
    weekly:
      - days: [mon, tue, wed, thu, fri]
        from: '09:00'
        to: '12:00'

meetings:
  chat:
    title: '30-minute chat'
    duration_minutes: 30
    require_approval: true
    description: 'A quick introductory call.'
    schedule: 'standard'
    booking_calendar: 'main'
    video_chat:
      provider: 'fixture-video'
      attach:
        auto: false

  host-rules:
    title: 'Host availability rules fixture'
    visibility: 'unlisted'
    duration_minutes: 30
    require_approval: true
    show_slots: true
    schedule: 'standard'
    booking_calendar: 'main'
    padding_before_minutes: 15
    padding_after_minutes: 15
    daily_booking_limit: 1

  host-durations:
    title: 'Host duration choices fixture'
    visibility: 'unlisted'
    duration_minutes: 60
    additional_duration_minutes: [25]
    require_approval: true
    show_slots: true
    schedule: 'host-durations'
    booking_calendar: 'main'
    notice_minutes: 0
    padding_before_minutes: 0
    padding_after_minutes: 0
    daily_booking_limit: null

url:
  app: 'http://localhost:4183'
  worker: 'http://127.0.0.1:9'

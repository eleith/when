packages:
  - 'apps/*'
  - 'packages/*'

# Shared dependency versions for the workspace. Packages and apps reference these
# with `"<dep>": "catalog:"` so tooling versions stay aligned in one place.
catalog:
  '@eslint/js': 10.0.1
  '@types/node': 24.12.4
  '@vitest/coverage-v8': 4.1.7
  eslint: 10.4.1
  eslint-config-prettier: 10.1.8
  globals: 17.6.0
  prettier: 3.8.3
  typescript: 6.0.3
  typescript-eslint: 8.60.0
  vite: 8.0.16
  vitest: 4.1.7

# Patched releases for transitive copies the catalog can't reach.
overrides:
  nodemailer: 9.0.3
  vite: 8.0.16
  postcss: 8.5.23

allowBuilds:
  esbuild: true

# Allow esbuild (pulled in by Vite) to run its install script. It's the only
# dependency with a build step; everything else (incl. @node-rs/argon2 prebuilds)
# needs none.
onlyBuiltDependencies:
  - esbuild

minimumReleaseAgeExclude:
  - '@takumi-rs/core-darwin-arm64@2.2.0'
  - '@takumi-rs/core-darwin-x64@2.2.0'
  - '@takumi-rs/core-linux-arm64-gnu@2.2.0'
  - '@takumi-rs/core-linux-arm64-musl@2.2.0'
  - '@takumi-rs/core-linux-x64-gnu@2.2.0'
  - '@takumi-rs/core-linux-x64-musl@2.2.0'
  - '@takumi-rs/core-win32-arm64-msvc@2.2.0'
  - '@takumi-rs/core-win32-x64-msvc@2.2.0'
  - '@takumi-rs/core@2.2.0'
  - '@takumi-rs/helpers@2.2.0'
  - '@takumi-rs/wasm@2.2.0'
  - takumi-js@2.2.0

# Hot-reload dev environment. Run with:
#   docker compose -f docker-compose.dev.yml up
# or via the package.json shortcut: bun run dev:docker
#
# Bind-mounts the project source so file changes trigger Vite HMR. node_modules
# lives in an anonymous volume so the host's node_modules (or absence thereof)
# does not shadow the container's.

services:
  when-dev:
    image: oven/bun:1.3.13-alpine
    platform: linux/amd64
    # Run as the host user so files created in bind-mounted dirs (e.g.
    # .svelte-kit/, data/) stay editable on the host.
    user: '${UID:-1000}:${GID:-1000}'
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && exec bun run dev --host 0.0.0.0"
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      AUTH_SECRET: ${AUTH_SECRET:-development-only-secret-please-change-it-32chars}
      # ENCRYPTION_KEY intentionally unset; dev mode auto-generates an ephemeral
      # key with a loud warning. Stored secrets (OAuth tokens) won't survive a
      # restart in this mode — that's OK for local iteration.

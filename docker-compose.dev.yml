# Hot-reload dev environment. Run with:
#   docker compose -f docker-compose.dev.yml up
# or via the package.json shortcut: bun run dev:docker
#
# Builds from Dockerfile.dev which pre-installs dependencies and makes
# writable directories world-accessible (chmod 777) so the host-mapped
# user can write at runtime. Bind-mounts the project source for HMR.

services:
  when-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    platform: linux/amd64
    user: '${UID:-1000}:${GID:-1000}'
    working_dir: /app
    command: ./scripts/dev-entrypoint.sh
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      AUTH_SECRET: ${AUTH_SECRET:-development-only-secret-please-change-it-32chars}
      # ENCRYPTION_KEY intentionally unset; dev mode auto-generates an ephemeral
      # key with a loud warning. Stored secrets (OAuth tokens) won't survive a
      # restart in this mode — that's OK for local iteration.

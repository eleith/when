services:
  when-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    user: '${UID:-1000}:${GID:-1000}'
    ports:
      - '5173:5173'
    volumes:
      - ./.env:/app/.env
      - ./src:/app/src
      - ./static:/app/static
      - ./config.yaml:/app/config.yaml
      - ./config.schema.json:/app/config.schema.json
      - ./svelte.config.js:/app/svelte.config.js
      - ./vite.config.ts:/app/vite.config.ts
      - ./tsconfig.json:/app/tsconfig.json
      - ./eslint.config.js:/app/eslint.config.js
      - ./data:/app/data
    environment:
      NODE_ENV: development
      AUTH_SECRET: ${AUTH_SECRET:-development-only-secret-please-change-it-32chars}

volumes:
  when-dev-data:

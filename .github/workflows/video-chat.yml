name: CI (Video Chat Package)

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/video-chat.yml'
      - 'packages/video-chat/**'
      - 'packages/config/**'
      - 'packages/db/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/video-chat.yml'
      - 'packages/video-chat/**'
      - 'packages/config/**'
      - 'packages/db/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter "@when/video-chat..." build

      - name: Lint
        run: pnpm --filter @when/video-chat lint

      - name: Test
        run: pnpm --filter @when/video-chat test:coverage
